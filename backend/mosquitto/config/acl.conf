# ==============================================================================
# Mosquitto Access Control List (ACL) Example (Blueprint §3.5 & §5)
# Topic Hierarchy:
#   home/{homeId}/dev/{deviceId}/cmd   (write: app, read: device/root)
#   home/{homeId}/dev/{deviceId}/state (write: device/root, read: app/everyone)
#   home/{homeId}/gw/{gatewayId}/status(write: root, read: app)
#   home/{homeId}/events               (write: root, read: app)
# ==============================================================================

# Pattern for Home App Users (authenticated via client certificate or username/JWT)
# App user pattern: username matches user_{userId}_home_{homeId}
pattern read home/%u/dev/+/state
pattern write home/%u/dev/+/cmd
pattern read home/%u/gw/+/status
pattern read home/%u/events

# Pattern for ESP32 Sub-Devices
# Device username: dev_{deviceId}
pattern write home/+/dev/%u/state
pattern read home/+/dev/%u/cmd

# Pattern for ESP32 Root Gateway (proxying for entire mesh home)
# Root username: gw_{homeId}_{gatewayId}
pattern write home/+/dev/+/state
pattern read home/+/dev/+/cmd
pattern write home/+/gw/+/status
pattern write home/+/events
